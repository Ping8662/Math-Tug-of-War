<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>數學理財金庫</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'#6B3F1D',sand:'#F3B9B9',cream:'#FFF3EA',leaf:'#D9ECB8',lake:'#B7E0EE'}}}}</script>
<style>
body{background:linear-gradient(#F9D6D6 0,#FFF3EA 260px) no-repeat #FFF3EA;min-height:100vh;color:#6B3F1D;font-family:"Noto Sans TC",system-ui,sans-serif}
.card{background:#fff;border:2px solid #F3B9B9;border-radius:1.25rem;box-shadow:0 4px 0 #F3B9B9}
.btn{border-radius:.9rem;font-weight:900;padding:.65rem 1rem;transition:transform .12s}
.btn:active{transform:translateY(2px)}.btn:disabled{opacity:.4;cursor:not-allowed}
.up{color:#15803d}.down{color:#dc2626}
input{border:2px solid #F3B9B9;border-radius:.7rem;padding:.45rem .7rem;background:#FFF3EA;color:#6B3F1D;min-width:0}
input:focus,button:focus-visible{outline:3px solid #B7E0EE}
</style>
</head>
<body>
<div id="app" class="max-w-5xl mx-auto p-4"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== 1. 貼上你的 Firebase 設定（Firebase 主控台 → 專案設定 → 一般 → 您的應用程式）===== */
const firebaseConfig={
  apiKey:"AIzaSyAqF5XPxnezG16h3i6qsqWLSczVqtN6tlU",
  authDomain:"financial-expert-6af20.firebaseapp.com",
  projectId:"financial-expert-6af20",
  storageBucket:"financial-expert-6af20.firebasestorage.app",
  messagingSenderId:"791108878369",
  appId:"1:791108878369:web:e38ac2ec00b20a99336360"
};
/* ===== 2. 系統參數 ===== */
const TEACHER_KEY="0602", DEF_PIN="0000", WAGE=100, OT_MAX=2, N=10;
const CLOUD=!firebaseConfig.apiKey.startsWith("YOUR");
/* 週次劇本：t=時期 b=定存% d=債券% s=股市% n=給學生的心得 */
const R=[
{t:"網路泡沫殘局 (2000)",b:.03,d:.1,s:-5,n:"剛開局就遇到空頭下跌，體驗「股票買了會賠錢」！"},
{t:"打底期與緩步回穩",b:.03,d:.1,s:1.5,n:"市場止跌，存股族開始分批佈局。"},
{t:"金融海嘯驚魂 (2008)",b:.02,d:.05,s:-12,n:"黑色星期五！大盤重挫，資產縮水的恐慌。"},
{t:"海嘯後復甦與智慧型手機起飛",b:.03,d:.1,s:8.5,n:"危機就是轉機！跌深後強力反彈，勇敢加碼的人賺翻。"},
{t:"台積電與蘋概股黃金年代",b:.03,d:.15,s:4,n:"長期抱緊績優股的威力，資產穩健向上。"},
{t:"中美貿易戰與疫情震盪 (2020)",b:.02,d:.1,s:-6.5,n:"突發利空急跌，隨後又快速彈回。"},
{t:"通膨升息循環 (2022)",b:.05,d:.2,s:-3,n:"定存與債券利率調高，保底資產變得迷人！"},
{t:"升息尾聲，科技股醞釀",b:.05,d:.2,s:5,n:"熬過升息痛苦期，市場開始預期降息。"},
{t:"AI 狂潮大爆發 (2023)",b:.04,d:.15,s:15,n:"生成式 AI 帶動大盤創歷史新高！"},
{t:"AI 應用落地，最終決戰 (2024)",b:.04,d:.15,s:6,n:"封關結算！有人靠 AI 股賺大錢，有人選擇定存穩穩拿保底。"}];
const STOCK_CAP=0.6; /* 股市最多占總資產 60% */
const TERMS=[[3,"半年期"],[6,"一年期"],[10,"兩年期"]];
const MULT={dep:[3,5,8],bond:[2,3,4]}; /* 定存／債券利率 = 當週基準 × 倍數；期數越長利率越高 */

/* ===== 資料層：雲端用 Firestore，沒設定時自動使用本機測試模式 ===== */
const rpin=()=>String(crypto.getRandomValues(new Uint32Array(1))[0]%10000).padStart(4,"0");
const newStu=i=>({name:"學生"+i,pin:rpin(),cash:0,pure:0,h:[],sh:0,cost:0,hist:[],day:"",dayState:"",otPend:0,otWeek:0,last:null});
const fresh=()=>({week:0,students:Object.fromEntries([...Array(N)].map((_,i)=>[i+1,newStu(i+1)]))});
let S=fresh(), V=JSON.parse(sessionStorage.v||'{"r":"login"}'), M=null, ref, dirty=false, err="", PW=false;
const r2=x=>Math.round(x*100)/100, today=()=>new Date().toLocaleDateString("sv");
const $=n=>"$"+r2(n).toLocaleString();
const sg=n=>(n>0?"+":n<0?"-":"")+$(Math.abs(n));
const isInc=v=>v&&typeof v==="object"&&"i" in v;
const me=()=>S.students[V.id], P=()=>`students.${V.id}.`;

async function save(u){
  const c={};
  for(const k in u){
    const a=k.split("."),last=a.pop();let o=S;a.forEach(x=>o=o[x]);const v=u[k];
    if(isInc(v)){o[last]=Math.round(((o[last]||0)+v.i)*1e4)/1e4;c[k]=CLOUD?increment(v.i):o[last]}
    else{o[last]=v;c[k]=v}
  }
  try{ if(CLOUD) await updateDoc(ref,c); else localStorage.vault=JSON.stringify(S); }
  catch(e){err="儲存失敗："+e.message;alert("儲存失敗，請再按一次，或請老師幫忙檢查網路")}
  render();
}
async function init(){
  if(CLOUD){
    try{
      ref=doc(getFirestore(initializeApp(firebaseConfig)),"vault","main");
      if(!(await getDoc(ref)).exists()) await setDoc(ref,fresh());
      onSnapshot(ref,{includeMetadataChanges:true},s=>{S=s.data();PW=s.metadata.hasPendingWrites;softRender()},e=>{err="連線失敗："+e.message;render()});
    }catch(e){err="Firebase 啟動失敗："+e.message;render()}
  }else{ S=JSON.parse(localStorage.vault||"null")||fresh(); render(); }
}
const softRender=()=>{const a=document.activeElement;(a?.tagName==="INPUT"&&a.value!==a.defaultValue)?dirty=true:render()};
document.addEventListener("focusout",()=>{if(dirty){dirty=false;setTimeout(render,50)}});
const go=v=>{V=v;sessionStorage.v=JSON.stringify(v);M=null;render()};

/* ===== 學生動作 ===== */
const A={};
A.ask=(type,id)=>{M={type,id};render();setTimeout(()=>document.getElementById("mi")?.focus(),30)};
A.close=()=>{M=null;render()};
A.submit=()=>{
  const v=document.getElementById("mi").value.trim();
  if(M.type==="key"){ if(v===TEACHER_KEY){go({r:"teacher"});if(Object.values(S.students).some(s=>s.pin===DEF_PIN))A.rollAll(true)}else alert("金鑰不正確") }
  else{ v===S.students[M.id].pin?go({r:"student",id:M.id}):alert("PIN 碼不正確，再試一次！") }
};
A.logout=()=>go({r:"login"});
A.checkin=()=>{const s=me();
  if(s.dayState==="pending")return alert("你還有任務在等老師核准喔！");
  if(s.day===today())return;
  save({[P()+"day"]:today(),[P()+"dayState"]:"pending"})};
A.ot=()=>{const s=me();
  if(s.day!==today())return alert("請先完成今日基本任務打卡");
  if(s.otWeek+s.otPend>=OT_MAX)return alert("本週加班已達上限（最多 "+OT_MAX+" 單元），好好休息！");
  save({[P()+"otPend"]:{i:1}})};
A.buyH=(k,ti)=>{const s=me(),[tm]=TERMS[ti],w=S.week,n=Math.floor(+document.getElementById(k+tm).value);
  if(!(n>0))return alert("請輸入大於 0 的金額");
  if(n>s.cash)return alert("現金不足");
  if(w+tm>10)return alert("會超過第 10 週，無法購買");
  if(!confirm(`買入 ${$(n)}，到第 ${w+tm} 週才能領回，期間不能提前拿出。確定嗎？`))return;
  save({[P()+"cash"]:{i:-n},[P()+"h"]:[...(s.h||[]),{k,t:tm,a:n,r:rate(k,ti,w),s:w,m:w+tm}]})};
A.buyS=()=>{const s=me(),n=Math.floor(+document.getElementById("amt-s").value),pr=PR(S.week);
  if(!(n>0))return alert("請輸入大於 0 的金額");
  if(n>s.cash)return alert("現金不足");
  const room=Math.max(0,Math.floor(net(s)*STOCK_CAP-(s.sh||0)*pr));
  if(n>room)return alert(`分散投資規則：股市最多只能占總資產的 ${STOCK_CAP*100}%。\n你現在最多還能買 ${$(room)}，其餘請試試定存或債券！`);
  save({[P()+"cash"]:{i:-n},[P()+"sh"]:{i:n/pr},[P()+"cost"]:{i:n}})};
A.sellS=all=>{const s=me(),pr=PR(S.week),n=Math.floor(+document.getElementById("amt-s").value);
  if(!(s.sh>0))return alert("你目前沒有持股");
  if(all)return save({[P()+"cash"]:{i:r2(s.sh*pr)},[P()+"sh"]:0,[P()+"cost"]:0});
  if(!(n>0))return alert("請輸入要賣出的金額，或按「全部賣出」");
  if(n>r2(s.sh*pr))return alert("持股現值不足");
  save({[P()+"cash"]:{i:n},[P()+"sh"]:{i:-n/pr},[P()+"cost"]:{i:-s.cost*n/(s.sh*pr)}})};

/* ===== 老師動作 ===== */
A.pay=()=>{const u={};let c=0;
  for(const i in S.students){const s=S.students[i],p=`students.${i}.`;let amt=0;
    if(s.dayState==="pending"){amt+=WAGE;u[p+"dayState"]="paid"}
    if(s.otPend>0){amt+=s.otPend*WAGE;u[p+"otWeek"]={i:s.otPend};u[p+"otPend"]=0}
    if(amt){u[p+"cash"]={i:amt};u[p+"pure"]={i:amt};c++}}
  if(!c)return alert("目前沒有待審核項目");
  if(confirm(`核准並發薪給 ${c} 位學生？`))save(u)};
A.next=()=>{if(S.week>=10)return alert("10 週劇本已全部完成！");
  const w=S.week+1,x=R[S.week];
  if(!confirm(`推進到第 ${w} 週：${x.t}？全班定存、債券、股市將同步更新。`))return;
  const u={week:w},p0=PR(S.week),p1=PR(w);
  for(const i in S.students){const s=S.students[i],p=`students.${i}.`;let cash=0,dep=0,cp=0;const keep=[];
    for(const h of s.h||[]){
      if(h.k==="bond"){const c=r2(h.a*h.r/100);cash+=c;cp+=c;if(w===h.m)cash+=h.a;else keep.push(h)}
      else if(w===h.m){const it=r2(h.a*h.r/100*h.t);dep+=it;cash+=h.a+it}
      else keep.push(h)}
    if(cash)u[p+"cash"]={i:r2(cash)};
    const after=r2(s.cash+cash+keep.reduce((a,h)=>a+(h.k==="bond"?h.a:h.a*(1+h.r/100*(w-h.s))),0)+(s.sh||0)*p1);
    u[p+"hist"]=[...(s.hist||[]),{w,n:after,p:s.pure}];u[p+"h"]=keep;u[p+"last"]={week:w,dep:r2(dep),bond:r2(cp),stock:r2((s.sh||0)*(p1-p0)),hs:(s.sh||0)>0};u[p+"otWeek"]=0}
  save(u)};
A.name=(i,v)=>save({[`students.${i}.name`]:v.trim()||"學生"+i});
A.adj=i=>{const v=prompt(`調整 ${S.students[i].name} 的現金（可輸入負數，如 -50）`);
  if(v===null||isNaN(+v)||+v===0)return;
  save({[`students.${i}.cash`]:{i:+v},[`students.${i}.pure`]:{i:+v}})};
A.pin=i=>{if(confirm(`為 ${S.students[i].name} 重新產生亂數 PIN？舊 PIN 會立刻失效。`))save({[`students.${i}.pin`]:rpin()})};
A.rollAll=quiet=>{if(!quiet&&!confirm("為全班重新產生亂數 PIN？所有舊 PIN 會立刻失效。"))return;
  const u={},used=new Set();for(const i in S.students){let x;do{x=rpin()}while(used.has(x));used.add(x);u[`students.${i}.pin`]=x}save(u)};
A.reset=()=>{if(!confirm("重置整個遊戲？所有金額與週次歸零（姓名與 PIN 保留）。"))return;
  const f=fresh();for(const i in f.students){f.students[i].name=S.students[i].name;f.students[i].pin=S.students[i].pin}
  S=f;if(CLOUD)setDoc(ref,f);else localStorage.vault=JSON.stringify(f);render()};
window.A=A;

/* ===== 畫面 ===== */
const PR=w=>{let p=100;for(let i=0;i<w;i++)p*=1+R[i].s/100;return r2(p)};
const rate=(k,ti,w)=>Math.round(R[w][k==="dep"?"b":"d"]*MULT[k][ti]*1000)/1000;
const hv=h=>h.k==="bond"?h.a:r2(h.a*(1+h.r/100*(S.week-h.s)));
const net=s=>r2(s.cash+(s.h||[]).reduce((a,h)=>a+hv(h),0)+(s.sh||0)*PR(S.week));
const chart=ps=>{const mn=Math.min(...ps)-3,mx=Math.max(...ps)+3,W=320,H=90,
  px=i=>ps.length<2?W/2:8+i*(W-16)/(ps.length-1),py=v=>H-6-(v-mn)/(mx-mn)*(H-12);
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-24"><polyline fill="none" stroke="#6B3F1D" stroke-width="3" stroke-linejoin="round" points="${ps.map((v,i)=>px(i)+","+py(v)).join(" ")}"/>${ps.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v)}" r="4" fill="${i&&v<ps[i-1]?"#dc2626":i&&v>ps[i-1]?"#15803d":"#6B3F1D"}"/>`).join("")}</svg>`};
function prod(s,k,name,desc){const w=S.week,mine=(s.h||[]).filter(h=>h.k===k),dep=k==="dep";
  return `<section class="card p-5 mb-4"><h2 class="font-black text-lg">${name}</h2><p class="text-sm mb-3">${desc}</p>
  <div class="grid sm:grid-cols-3 gap-3">${TERMS.map(([tm,label],ti)=>{const ok=w+tm<=10,r=ok?rate(k,ti,w):0;
    return `<div class="rounded-2xl p-3 bg-cream border-2 border-sand"><div class="font-black">${label}（${tm} 週）</div>${ok?
    `<div class="text-sm">${dep?"每週利率":"每週配息"} <b>${r}%</b></div>
     <div class="text-xs mb-2">${dep?`到期共多 ${r2(r*tm)}%`:`每週領息，到期還本金`} ・ 第 ${w+tm} 週到期</div>
     <input id="${k}${tm}" type="number" min="1" inputmode="numeric" placeholder="金額" class="w-full mb-2">
     <button class="btn bg-lake w-full" onclick="A.buyH('${k}',${ti})">買入並鎖定</button>`:
    `<div class="text-sm opacity-60 mt-2">會超過第 10 週，無法購買</div>`}</div>`}).join("")}</div>
  ${mine.length?`<div class="mt-3 text-sm font-bold">我的${dep?"定存":"債券"}（🔒 到期前不能提前拿出）</div>`+mine.map(h=>`<div class="py-1 text-sm">${$(h.a)} ・ ${h.t} 週期 ・ ${h.r}% ・ 第 ${h.m} 週到期（還有 ${h.m-w} 週）・ ${dep?`預計領回 <b>${$(h.a*(1+h.r/100*h.t))}</b>`:`每週配息 <b>${$(h.a*h.r/100)}</b>`}</div>`).join(""):""}</section>`}
function riskSec(s){const w=S.week,n=net(s),d=r2(n-s.pure),
  ds=(s.hist||[]).map(x=>({w:x.w,d:r2(x.n-x.p),pc:x.p?r2((x.n-x.p)/x.p*100):0})),
  lo=ds.reduce((a,x)=>!a||x.d<a.d?x:a,null),hi=ds.reduce((a,x)=>!a||x.d>a.d?x:a,null),
  kd=new Set((s.h||[]).map(h=>h.k));if(s.sh>0)kd.add("stock");
  return `<section class="card p-5 mb-4 ${w>=10?"bg-lake/30":""}"><h2 class="font-black text-lg mb-2">${w>=10?"🏁 最終結算":"🛡️ 風險紀錄"}</h2>
  <div class="text-sm mb-1">分散度：持有 <b>${kd.size} / 3</b> 種商品 ${kd.size>=2?"🏅 分散投資達人":"（再多買一種，就能拿到徽章）"}</div>
  ${lo?`<div class="p-3 rounded-xl ${lo.d<0?"bg-red-100":"bg-leaf"} my-2"><b>過程中最慘的一週：第 ${lo.w} 週</b><br>${lo.d<0?`身價比純現金少 <b class="down">${$(-lo.d)}（${lo.pc}%）</b>。那時如果你急需用錢，就只能認賠了。`:`那週身價仍比純現金多 ${$(lo.d)}，沒有出現虧損。`}</div>
  <div class="text-sm">最高點：第 ${hi.w} 週，比純現金${hi.d>=0?"多":"少"} ${$(Math.abs(hi.d))}</div>`:`<div class="text-sm opacity-70">推進一週後，這裡會記錄你每週的賺賠，找出最慘的那一週。</div>`}
  ${w>=10?`<div class="mt-2 font-black ${d>=0?"up":"down"}">最終身價 ${$(n)}，比純現金${d>=0?"多":"少"} ${$(Math.abs(d))}</div><p class="text-sm mt-2">想一想：你的成績是靠運氣，還是靠分散風險？如果歷史劇本不一樣，你的選擇還會一樣嗎？</p>`:""}</section>`}
const worst=s=>(s.hist||[]).reduce((a,x)=>!a||x.n-x.p<a.d?{w:x.w,d:r2(x.n-x.p)}:a,null);
function stockSec(s){const w=S.week,ps=[...Array(w+1)].map((_,i)=>PR(i)),pr=ps[w],
  d1=w?r2((pr/ps[w-1]-1)*100):0,d3=w?r2((pr/ps[Math.max(0,w-3)]-1)*100):0,
  tr=d3>2?["▲ 上升趨勢","up"]:d3<-2?["▼ 下跌趨勢","down"]:["－ 盤整震盪",""],
  val=r2((s.sh||0)*pr),pl=r2(val-(s.cost||0)),pc=s.cost?r2(pl/s.cost*100):0;
  return `<section class="card p-5 mb-4"><h2 class="font-black text-lg">🚀 股市／AI 科技大盤 ETF</h2>
  <p class="text-sm mb-2">價格每週變動，可以隨時買賣。低買高賣才賺錢；買了之後下跌，就會虧損。</p>
  <div class="flex flex-wrap items-end gap-x-4"><div class="text-4xl font-black">${pr}</div>
  <div class="font-black ${d1>=0?"up":"down"}">${w?(d1>=0?"▲ ":"▼ ")+Math.abs(d1)+"% 本週":"尚未開盤變動"}</div><div class="font-black ${tr[1]}">${tr[0]}</div></div>
  ${chart(ps)}
  <div class="grid grid-cols-3 gap-2 my-3 text-center text-sm"><div class="rounded-xl bg-cream p-2">持有<br><b>${r2(s.sh||0)} 單位</b></div>
  <div class="rounded-xl bg-cream p-2">現值<br><b>${$(val)}</b></div>
  <div class="rounded-xl p-2 ${pl>=0?"bg-leaf up":"bg-red-100 down"}">損益<br><b>${pl>=0?"▲ ":"▼ "}${$(Math.abs(pl))}（${pc}%）</b></div></div>
  <div class="text-sm mb-2">股市占總資產 <b>${net(s)?r2(val/net(s)*100):0}%</b>（買進上限 ${STOCK_CAP*100}%，要分散投資喔）</div>
  <div class="flex flex-wrap gap-2"><input id="amt-s" type="number" min="1" inputmode="numeric" placeholder="金額" class="flex-1 min-w-24">
  <button class="btn bg-lake" onclick="A.buyS()">買進</button><button class="btn bg-sand" onclick="A.sellS(false)">賣出</button><button class="btn bg-cream border-2 border-sand" onclick="A.sellS(true)">全部賣出</button></div></section>`}
const chg=(label,v,held)=>{
  if(!held)return `<div class="flex justify-between py-1"><span>${label}</span><span class="opacity-50">本週未持有</span></div>`;
  const c=v>0?"up":v<0?"down":"";
  return `<div class="flex justify-between py-1"><span>${label}</span><b class="${c}">${v>0?"▲":v<0?"▼":"－"} ${sg(v)}</b></div>`};

function loginView(){
  return `<header class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-black">🏛️ 數學理財金庫</h1>
    <button class="btn bg-ink text-cream" onclick="A.ask('key')">導師後台</button></header>
  <p class="mb-4 font-medium">請點選你的座號，輸入老師給你的 4 位數 PIN 碼</p>
  <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
  ${Object.entries(S.students).map(([i,s])=>`<button class="card p-4 text-center hover:bg-leaf" onclick="A.ask('pin',${i})">
    <div class="text-3xl font-black">${i}</div><div class="truncate">${s.name}</div></button>`).join("")}</div>`}

function studentView(){
  const s=me(),n=net(s),diff=r2(n-s.pure),w=S.week,L=s.last;
  const done=s.day===today(), st=s.dayState;
  const badge=st==="pending"?"⏳ 待老師審核":st==="paid"?"✅ 已發薪":"尚未打卡";
  const left=OT_MAX-s.otWeek-s.otPend;
  return `<header class="flex justify-between items-center mb-4">
    <div><div class="text-sm">${V.id} 號</div><h1 class="text-3xl font-black">${s.name} 的金庫</h1></div>
    <button class="btn bg-sand" onclick="A.logout()">登出</button></header>

  <div class="flex gap-1 mb-4" title="第 ${w} / 10 週">${R.map((_,i)=>`<div class="h-3 flex-1 rounded-full ${i<w?"bg-ink":"bg-sand"}"></div>`).join("")}</div>

  <section class="grid sm:grid-cols-2 gap-4 mb-4">
    <div class="card p-5 bg-sand/40"><div class="font-bold">💰 現金保底總額</div>
      <div class="text-4xl font-black mt-1">${$(s.pure)}</div><div class="text-sm mt-1">完全不理財、只領薪水的累積</div></div>
    <div class="card p-5 bg-lake/40"><div class="font-bold">🚀 實際投資身價</div>
      <div class="text-4xl font-black mt-1">${$(n)}</div>
      <div class="text-sm mt-1 font-bold ${diff>=0?"up":"down"}">${diff>=0?"▲ 比純現金多":"▼ 比純現金少"} ${$(Math.abs(diff))}</div></div>
  </section>

  ${L?`<section class="card p-5 mb-4">
    <div class="font-black text-lg mb-1">第 ${L.week} 週成績：${R[L.week-1].t}</div>
    <p class="mb-2 text-sm">${R[L.week-1].n}</p>
    ${chg("🏦 定存到期利息",L.dep||0,(L.dep||0)!==0)}${chg("📜 債券配息",L.bond||0,(L.bond||0)!==0)}${chg("🚀 股市賺賠",L.stock||0,L.hs)}
    ${L.stock<0?`<div class="mt-2 p-2 rounded-lg bg-red-100 down font-bold">⚠️ 股市下跌！你的股票資產減少 ${$(-L.stock)}</div>`:""}
    ${L.stock>0?`<div class="mt-2 p-2 rounded-lg bg-leaf up font-bold">🎉 股市上漲！你的股票資產增加 ${$(L.stock)}</div>`:""}
  </section>`:`<section class="card p-5 mb-4 bg-leaf/60">老師按下「推進到下一週」後，這裡會顯示本週的投資成績。</section>`}

  <section class="card p-5 mb-4">
    <h2 class="font-black text-lg mb-3">📋 今日打卡 <span class="text-sm font-medium">（${badge}）</span></h2>
    <div class="grid sm:grid-cols-2 gap-3">
      <button class="btn bg-leaf" ${done&&st!==""&&st!=="x"?"disabled":""} onclick="A.checkin()">回報今日均一任務完成<br><span class="text-sm">+${$(WAGE)}</span></button>
      <button class="btn bg-sand" ${left<=0||!done?"disabled":""} onclick="A.ot()">申請今日加班（超額任務）<br><span class="text-sm">+${$(WAGE)}／單元 ・ 本週還可申請 ${Math.max(left,0)} 次${s.otPend?` ・ 待審 ${s.otPend}`:""}</span></button>
    </div></section>

  <div class="card p-4 mb-4 bg-sand/40 font-black text-lg">👛 可用現金：${$(s.cash)}</div>
  ${prod(s,"dep","🏦 銀行定存","把錢存進銀行，約定存幾週。時間到了連本帶利領回；期數越長，利率越高，但中途不能領出。")}
  ${prod(s,"bond","📜 保守型債券","債券是「借錢給政府或大公司」：對方每週付你利息（配息），到期再還本金。風險低、利息比定存高，同樣到期前不能賣出。")}
  ${stockSec(s)}
  ${riskSec(s)}

  ${w?`<section class="card p-5"><h2 class="font-black text-lg mb-2">📰 市場回顧</h2>
    ${R.slice(0,w).map((x,i)=>`<div class="py-1 text-sm">第 ${i+1} 週 ${x.t}　股市 <b class="${x.s>=0?"up":"down"}">${x.s>=0?"▲ +":"▼ "}${x.s}%</b></div>`).join("")}</section>`:""}`}

function teacherView(){
  const rows=Object.entries(S.students),pend=rows.filter(([,s])=>s.dayState==="pending").length;
  const otp=rows.reduce((a,[,s])=>a+s.otPend,0),w=S.week;
  return `<header class="flex flex-wrap gap-2 justify-between items-center mb-4">
    <h1 class="text-3xl font-black">👩‍🏫 導師後台</h1>
    <button class="btn bg-sand" onclick="A.logout()">登出</button></header>
  <section class="card p-5 mb-4 flex flex-wrap gap-3 items-center">
    <div class="mr-auto"><div class="font-black text-lg">第 ${w} / 10 週 ${w?"・ "+R[w-1].t:"・ 尚未開始"}</div>
      <div class="text-sm">待審核打卡 ${pend} 人、加班 ${otp} 單元${w<10?`　下一週：${R[w].t}`:"　已結算"}</div></div>
    <button class="btn bg-leaf" onclick="A.pay()">一鍵批次發薪</button>
    <button class="btn bg-lake" ${w>=10?"disabled":""} onclick="A.next()">推進到下一週</button>
    <button class="btn bg-sand" onclick="A.rollAll()">🎲 全班換 PIN</button>
    <button class="btn bg-red-100 down" onclick="A.reset()">重置遊戲</button></section>
  <section class="card p-3 overflow-x-auto"><table class="w-full text-sm text-left whitespace-nowrap">
    <thead><tr class="border-b-2 border-sand"><th class="p-2">座號</th><th>姓名</th><th>今日打卡</th><th>加班</th><th>現金</th><th>純現金</th><th>PIN</th><th>實際身價</th><th>最慘一週</th><th>微調</th></tr></thead><tbody>
    ${rows.map(([i,s])=>{const t=s.day===today();
      const b=s.dayState==="pending"?'<span class="px-2 rounded-full bg-sand">待審核</span>':s.dayState==="paid"&&t?'<span class="px-2 rounded-full bg-leaf">已完成</span>':'<span class="opacity-50">未打卡</span>';
      return `<tr class="border-b border-sand/60"><td class="p-2 font-black">${i}</td>
      <td><input value="${s.name}" class="w-28" onchange="A.name(${i},this.value)"></td><td>${b}</td>
      <td>${s.otWeek}/${OT_MAX}${s.otPend?` <b>(+${s.otPend}待審)</b>`:""}</td>
      <td>${$(s.cash)}</td><td>${$(s.pure)}</td><td class="font-black tracking-widest bg-cream">${s.pin}</td><td class="font-bold ${net(s)>=s.pure?"up":"down"}">${$(net(s))}</td><td>${(()=>{const x=worst(s);return x?`<span class="${x.d<0?"down":"up"}">第${x.w}週 ${x.d>=0?"+":"-"}${$(Math.abs(x.d))}</span>`:"－"})()}</td>
      <td><button class="btn bg-sand !py-1" onclick="A.adj(${i})">±現金</button> <button class="btn bg-cream !py-1 border-2 border-sand" onclick="A.pin(${i})">🎲 換PIN</button></td></tr>`}).join("")}
    </tbody></table></section>
  <p class="text-xs mt-3">「±現金」會同時調整現金與純現金保底，維持兩條資產線公平比較。PIN 欄只有導師後台看得到，學生忘記時請查這裡。</p>`}

function render(){
  const modal=M?`<div class="fixed inset-0 bg-ink/50 flex items-center justify-center p-4 z-10">
    <div class="card p-6 w-full max-w-xs"><h2 class="font-black text-lg mb-3">${M.type==="key"?"導師金鑰":S.students[M.id].name+"，請輸入 PIN"}</h2>
    <input id="mi" type="password" inputmode="numeric" class="w-full mb-3 text-center text-2xl tracking-widest" onkeydown="if(event.key==='Enter')A.submit()">
    <div class="flex gap-2"><button class="btn bg-sand flex-1" onclick="A.close()">取消</button><button class="btn bg-ink text-cream flex-1" onclick="A.submit()">進入</button></div></div></div>`:"";
  const bar=`<div class="text-xs mb-3 ${CLOUD?"":"p-2 rounded-lg bg-sand"}">${CLOUD?(PW?"⏳ 資料傳送中，請先不要關掉頁面…":"☁️ 已連線雲端同步"):"⚠️ 本機測試模式：尚未設定 Firebase，資料只存在這台電腦"}${err?` <b class="down">${err}</b>`:""}</div>`;
  const body=V.r==="teacher"?teacherView():V.r==="student"&&S.students[V.id]?studentView():loginView();
  document.getElementById("app").innerHTML=bar+body+modal;
}
init();
</script>
</body>
</html>
